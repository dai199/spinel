name: fork-gate
on:
  pull_request:
    branches: [master]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: make deps
      - run: make gate CC=gcc REFUSALS_JOBS=4 GATE_RUBY=$(which ruby)
  macos-test:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: brew install coreutils && echo "/opt/homebrew/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
      - run: make deps
      - run: make -j$(getconf _NPROCESSORS_ONLN) all
      - run: make -j$(getconf _NPROCESSORS_ONLN) test OPT=-O0 CC=clang
